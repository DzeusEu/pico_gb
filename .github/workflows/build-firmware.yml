name: Build RTSP_OS firmware (MicroPython + Game Boy + NES cores)

on:
  workflow_dispatch:
    inputs:
      board:
        description: "Board. RPI_PICO leaves out Wi-Fi (unused by TinyOS) and should leave more free RAM; it also runs on a Pico W."
        type: choice
        default: RPI_PICO_W
        options:
          - RPI_PICO_W
          - RPI_PICO
      freeze_os:
        description: "Freeze the TinyOS system files into the firmware (saves a lot of RAM)"
        type: boolean
        default: true
      ram_code:
        description: "Run the emulator core from RAM instead of flash (faster; costs about 20 KB of RAM)"
        type: boolean
        default: true
      micropython_ref:
        description: MicroPython tag or branch to build
        default: v1.24.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repository
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake gcc-arm-none-eabi libnewlib-arm-none-eabi build-essential python3 curl git

      - name: Get MicroPython
        run: git clone --depth 1 --branch "${{ inputs.micropython_ref || 'v1.24.1' }}" https://github.com/micropython/micropython.git

      - name: Get the Peanut-GB header (MIT license)
        run: |
          mkdir -p usermod/gbemu
          curl -fL -o usermod/gbemu/peanut_gb.h https://raw.githubusercontent.com/deltabeard/Peanut-GB/v1.2.0/peanut_gb.h \
            || curl -fL -o usermod/gbemu/peanut_gb.h https://raw.githubusercontent.com/deltabeard/Peanut-GB/master/peanut_gb.h
          wc -l usermod/gbemu/peanut_gb.h

      - name: Place the hot emulator functions in RAM
        if: ${{ inputs.ram_code != false }}
        run: |
          sed -i -E 's/^((static )?(inline )?(void|uint8_t|uint_fast8_t|uint_fast16_t) +)(__gb_read|__gb_write|__gb_execute_cb|__gb_draw_line|__gb_step_cpu|gb_run_frame)\(/__attribute__((section(".time_critical.gbemu"))) \1\5(/' usermod/gbemu/peanut_gb.h
          echo "functions moved to RAM:"; grep -c 'time_critical.gbemu' usermod/gbemu/peanut_gb.h || true

      - name: Build mpy-cross
        run: make -C micropython/mpy-cross -j4

      - name: Fetch MicroPython submodules
        run: make -C micropython/ports/rp2 BOARD=${{ inputs.board || 'RPI_PICO_W' }} submodules

      - name: Build firmware with the gbemu + nesemu modules
        run: |
          BOARD="${{ inputs.board || 'RPI_PICO_W' }}"
          EXTRA=""
          if [ "${{ inputs.freeze_os }}" != "false" ]; then
            EXTRA="FROZEN_MANIFEST=$GITHUB_WORKSPACE/manifest.py"
          fi
          echo "Building BOARD=$BOARD $EXTRA"
          make -C micropython/ports/rp2 BOARD=$BOARD USER_C_MODULES=$GITHUB_WORKSPACE/usermod/micropython.cmake $EXTRA -j4

      - name: Upload UF2
        uses: actions/upload-artifact@v4
        with:
          name: tinyos-firmware
          path: micropython/ports/rp2/build-${{ inputs.board || 'RPI_PICO_W' }}/firmware.uf2
